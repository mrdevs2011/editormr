<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EditorMR</title>
  <meta name="application-name" content="EMR" />
  <meta name="apple-mobile-web-app-title" content="EMR" />
  <meta name="theme-color" content="#191d22" />

  <!-- login tekshiruvi tugaguncha sahifa ko'rinmasin (flash bo'lmasligi uchun) -->
  <style>html.auth-pending body { visibility: hidden; }</style>
  <script>document.documentElement.classList.add('auth-pending');</script>

  <!-- ===== ICONS ===== -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- ===== STYLES ===== -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/upload.css" />
  <link rel="stylesheet" href="css/preview.css" />
  <link rel="stylesheet" href="css/toolbar.css" />
  <link rel="stylesheet" href="css/timeline.css" />
  <link rel="stylesheet" href="css/timeline-scrollbar.css" />
  <link rel="stylesheet" href="css/media-blocks.css" />
  <link rel="stylesheet" href="css/transition-toast.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/tablet.css" />
  <link rel="stylesheet" href="css/canvas.css" />
</head>
<body>
  <!-- DASHBOARD (Projects + kichik upload) -->
  <div id="upload-screen">
    <div class="dash">
      <div class="dash-header">
        <h1 class="brand">
          <img src="assets/logo.png" alt="EMR" />
          <span>Editor</span>
        </h1>
        <div class="upload-box" id="upload-box">
          <span class="hint">drop a file anywhere · Ctrl+V</span>
          <a class="upload-btn ghost" href="help/" id="help-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 2.5-3 4"/><path d="M12 17h.01"/></svg>
            Yordam
          </a>
          <button class="upload-btn primary" id="upload-btn" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            Yangi loyiha
          </button>
          <div class="user-chip" id="user-chip" hidden>
            <span class="user-email" id="user-email"></span>
            <button class="upload-btn ghost" id="signout-btn" type="button">Sign out</button>
          </div>
        </div>
      </div>
      <div class="dash-section-head">
        <div class="section-label" id="projects-label">Projects</div>
        <div class="dash-sort" id="dash-sort" hidden>
          <label for="project-sort">Saralash</label>
          <select id="project-sort" aria-label="Loyihalarni saralash">
            <option value="updated">Oxirgi o‘zgartirilgan</option>
            <option value="name">Nom</option>
            <option value="created">Yaratilgan sana</option>
          </select>
        </div>
      </div>
      <div class="project-grid" id="project-grid"></div>
      <div class="dash-empty" id="dash-empty" hidden>
        <div class="dash-empty-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64" fill="none">
            <rect x="8" y="14" width="48" height="36" rx="6" stroke="currentColor" stroke-width="2"/>
            <path d="M8 38l12-10 10 8 8-6 18 14" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="22" cy="26" r="4" stroke="currentColor" stroke-width="2"/>
            <circle cx="48" cy="48" r="12" fill="#0D0F13" stroke="var(--brand-blue)" stroke-width="2"/>
            <path d="M48 42v12M42 48h12" stroke="var(--brand-blue)" stroke-width="2.2"/>
          </svg>
        </div>
        <h2 class="dash-empty-title">Hali loyihalar yo‘q</h2>
        <p class="dash-empty-desc">Video yoki rasm yuklab birinchi montajingizni boshlang. Faylni shu yerga tashlashingiz yoki Ctrl+V qilishingiz ham mumkin.</p>
        <button type="button" class="upload-btn primary dash-empty-cta" id="empty-new-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          Yangi loyiha yaratish
        </button>
      </div>
    </div>
    <input type="file" id="file-input" accept="video/*,image/*" />
  </div>

  <!-- EDITOR SCREEN -->
  <div id="editor-screen">
    <div class="preview-area">
      <div class="video-wrapper">
        <div class="preview-stack" id="preview-stack">
          <div class="preview-layer" id="preview-layer-b" aria-hidden="true">
            <video id="preview-video-b" playsinline muted></video>
            <img id="image-preview-b" alt="" hidden />
          </div>
          <div class="preview-layer is-main" id="preview-layer-a">
            <video id="preview-video" playsinline></video>
          </div>
          <div class="preview-layer preview-layer-float" id="preview-layer-float" aria-hidden="true">
            <video id="preview-video-float" playsinline muted></video>
            <img id="image-preview-float" alt="" hidden />
          </div>
          <div class="black-overlay" id="black-overlay"></div>
          <div class="text-overlay-root" id="text-overlay-root"></div>
        </div>
      </div>
      <div class="play-controls">
        <button class="play-btn" id="play-btn" title="Play / Pause (Space)">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="time-display" id="time-display">0:00 / 0:00</div>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-btn" id="back-btn" title="Back to Projects">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="add-media-btn" title="Add Video / Photo">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="music-btn" title="Add Music">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="text-btn" title="Add Text">
        <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn tool-btn-canvas" id="canvas-btn" title="Canvas (aspect ratio)" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10V8h2M17 14v2h-2"/></svg>
        <span class="cv-btn-label" id="canvas-btn-label">Fit</span>
      </button>
      <div class="tool-sep tool-sep-history"></div>
      <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 7"/></svg>
      </button>
      <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 7"/></svg>
      </button>
    </div>
    <input type="file" id="add-media-input" accept="video/*,image/*" multiple hidden />

    <div class="timeline-section" id="timeline-section">
      <div class="timeline-resize-handle" id="timeline-resize-handle" title="Drag to resize"></div>
      <div class="timeline-header">
        <div class="timeline-header-left">
          <span>Timeline</span>
        </div>
        <div class="timeline-header-right">
          <button class="zoom-btn" id="zoom-out" title="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
          </button>
          <span class="zoom-label" id="zoom-label">100%</span>
          <button class="zoom-btn" id="zoom-in" title="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="export-btn" id="export-btn" title="Export">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
          </button>
        </div>
      </div>
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="timeline-content" id="timeline-content">
          <div class="time-ruler" id="time-ruler"></div>

          <!-- Video track -->
          <div class="track" id="video-track">
            <div class="track-lane" id="video-lane"></div>
          </div>

          <!-- Music track -->
          <div class="track" id="music-track" style="display:none;">
            <div class="track-lane" id="music-lane"></div>
          </div>

          <!-- Text track -->
          <div class="track" id="text-track" style="display:none;">
            <div class="track-lane" id="text-lane"></div>
          </div>

          <div class="playhead" id="playhead"></div>
          <div class="marquee" id="marquee"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="mobile-action-bar" id="mobile-action-bar" aria-label="Mobile tools" hidden>
    <div class="mob-duration-row" id="mob-duration-row" hidden>
      <span class="mob-duration-label">Duration</span>
      <div class="mob-duration-btns">
        <button type="button" class="mob-dur-btn" data-dur="1">1s</button>
        <button type="button" class="mob-dur-btn" data-dur="2">2s</button>
        <button type="button" class="mob-dur-btn" data-dur="3">3s</button>
        <button type="button" class="mob-dur-btn" data-dur="5">5s</button>
        <button type="button" class="mob-dur-btn" data-dur="10">10s</button>
      </div>
    </div>
    <div class="mob-bar-actions">
    <button type="button" class="mob-btn" data-act="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 7"/></svg><span>Undo</span></button>
    <button type="button" class="mob-btn" data-act="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 7"/></svg><span>Redo</span></button>
    <button type="button" class="mob-btn" data-act="copy" data-need="sel" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
    <button type="button" class="mob-btn" data-act="paste" data-need="clip" title="Paste"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><span>Paste</span></button>
    <button type="button" class="mob-btn" data-act="float" data-need="video" title="Float"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1"/><rect x="8" y="9" width="10" height="7" rx="1"/></svg><span>Float</span></button>
    <button type="button" class="mob-btn" data-act="split" data-need="video" title="Split"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M6 4C4.34315 4 3 5.34315 3 7V17C3 18.6569 4.34315 20 6 20H18C19.6569 20 21 18.6569 21 17V7C21 5.34315 19.6569 4 18 4H6ZM5 7C5 6.44772 5.44772 6 6 6H11V18H6C5.44772 18 5 17.5523 5 17V7ZM13 18H18C18.5523 18 19 17.5523 19 17V7C19 6.44772 18.5523 6 18 6H13V18Z" fill="currentColor"/></svg><span>Split</span></button>
    <button type="button" class="mob-btn" data-act="dup" data-need="sel" title="Duplicate"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M9 16v2a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2"/></svg><span>Dup</span></button>
    <button type="button" class="mob-btn" data-act="del" data-need="sel" title="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6M14 11v6"/></svg><span>Del</span></button>
    </div>
  </div>

  <input type="file" id="music-input" accept="audio/mp3,audio/wav,audio/m4a,audio/mpeg,audio/x-m4a,.mp3,.wav,.m4a" />

  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div>Processing...</div>
  </div>

  <!-- ===== SCRIPTS (tartib muhim — har biri oldingisiga bog'liq) ===== -->
  <!-- ===== AUTH (Supabase) ===== -->
  <!-- FFmpeg.wasm (MP4 transcode) -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.requireSession()
      .then((session) => {
        if (session) {
          const emailEl = document.getElementById('user-email');
          if (emailEl) emailEl.textContent = session.user.email || '';
          const chip = document.getElementById('user-chip');
          if (chip) chip.hidden = false;
          const so = document.getElementById('signout-btn');
          if (so) so.addEventListener('click', () => Auth.signOut());
        }
        // Redirect kutilyotgan promise hech qachon resolve bo'lmasligi mumkin —
        // faqat haqiqiy sessiya yoki local bypass da UI ochiladi.
        document.documentElement.classList.remove('auth-pending');
      })
      .catch((e) => {
        console.error('[auth]', e);
        document.documentElement.classList.remove('auth-pending');
      });
  </script>

  <script src="js/state.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/video-blocks.js"></script>
  <script src="js/transition-toast.js"></script>
  <script src="js/add-media.js"></script>
  <script src="js/music.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/context-menu.js"></script>
  <script src="js/selection.js"></script>
  <script src="js/music-sync.js"></script>
  <script src="js/export.js"></script>
  <script src="js/resize-handle.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/text-overlay.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/mobile-toolbar.js"></script>
</body>
</html>
